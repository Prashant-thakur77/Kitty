[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib", "node_modules"]
allow_paths = ["node_modules"]
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/=node_modules/@openzeppelin/",
  "@gluwa/asc-contracts/=node_modules/@gluwa/asc-contracts/",
]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "shanghai"
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
creditcoin_testnet = "${CREDITCOIN_RPC_URL}"

[lint]
lint_on_build = false

[fuzz]
runs = 256

[invariant]
runs = 32
depth = 160
fail_on_revert = true
call_override = false
